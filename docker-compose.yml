services:
  db:
    image: pgvector/pgvector:pg16
    container_name: gkn_postgres
    environment:
      - POSTGRES_DB=gkn_rag
      - POSTGRES_USER=raguser
      - POSTGRES_PASSWORD=changeme_before_use
    ports:
      - "45432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U raguser -d gkn_rag" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
